    - generic [ref=f10e38]: Learning a new library with AI 52 software engineers who knew Python but had never used Trio, a Python library for asynchronous programming. Each engineer coded two features with Trio. One group had an AI assistant. The other group coded by hand. All engineers then took a quiz on Trio with no AI. Minutes to finish the task Quiz score AI assistant 23 50% By hand 25 67% The time difference is not significant. In the AI group, engineers who asked the AI for explanations scored 65–86%. Engineers who had the AI write or debug the code scored 24–39% . Shen and Tamkin, “How AI impacts skill formation,” Anthropic, January 2026
